<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #121214;
      --card: #1a1a1e;
      --border: #2a2a30;
      --text: #e1e1e6;
      --muted: #a8a8b3;
      --accent: #8257e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%;
      min-width: 360px;
      max-width: 420px;
      height: 560px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      overflow-y: auto;
    }

    /* Barra Superior */
    .add-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    input, select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    input[type="url"] { flex: 1; }
    input:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    button:hover { opacity: 0.9; }

    /* Lista de Feeds */
    #feed-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feed-section {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      padding: 4px 6px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
      user-select: none;
    }

    .feed-title-container {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex: 1;
      overflow: hidden;
    }

    .arrow-icon {
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .feed-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feed-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-action {
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      padding: 2px 4px;
      font-weight: normal;
      border-radius: 4px;
    }

    .btn-action:hover { color: var(--text); background: var(--border); }
    .btn-remove:hover { color: #e55151; }

    .rename-box {
      display: none;
      gap: 4px;
      margin: 6px 0;
    }

    .rename-box input {
      flex: 1;
      padding: 4px 8px;
      font-size: 12px;
    }

    /* Container sanfona / collapse */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .items-list.collapsed {
      display: none;
    }

    /* Cards de Notícias */
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      display: block;
      text-decoration: none;
      transition: border-color 0.15s ease;
    }

    .item:hover {
      border-color: #3e3e48;
    }

    .item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .item-date {
      font-size: 11px;
      color: var(--muted);
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <form class="add-bar" id="add-form">
    <input type="url" id="feed-url" placeholder="https://exemplo.com/rss.xml" required />
    <select id="item-limit" title="Itens por feed">
      <option value="3">3</option>
      <option value="5" selected>5</option>
      <option value="10">10</option>
      <option value="20">20</option>
    </select>
    <button type="submit">+</button>
  </form>

  <div id="feed-container">
    <div class="status" id="status-msg">Carregando seus feeds...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
